name: ScholarStay
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.17
  - pip=25.1.1
  # 核心数据科学库
  - numpy=1.26.4
  - pandas=2.3.0
  - scikit-learn=1.7.0
  - scipy=1.15.2
  - matplotlib=3.10.3
  - jupyterlab=4.4.3
  
  # Web框架和数据库 (核心)
  - fastapi=0.115.12
  - uvicorn=0.34.2 
  - sqlalchemy=2.0.41
  - psycopg2=2.9.9
  - asyncpg=0.29.0
  
  # AI/ML相关 (核心)
  - openai=1.81.0
  - langchain=0.3.25
  - langchain-community=0.3.24
  - langchain-openai=0.3.18
  - tiktoken=0.9.0
  
  # 向量数据库 (核心)
  - chroma-hnswlib=0.7.3
  - faiss-cpu=1.9.0
  
  # 前端和API
  - streamlit=1.47.0
  - requests=2.32.3
  
  # 数据处理
  - beautifulsoup4=4.13.4
  - pillow=10.4.0
  - pyyaml=6.0.2
  - pydantic=2.11.4
  - pydantic-core=2.33.2
  - tqdm=4.67.1
  
